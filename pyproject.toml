[project]
name = "airline-sentiment-lstm"
version = "1.0.0"
description = "Deep learning (Bidirectional LSTM) sentiment triage for airline customer feedback, with an honest baseline comparison, explainability, and a production Streamlit app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahat Mia" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
